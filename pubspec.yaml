name: flutter_settings_framework
description: Declarative Flutter settings with bilingual search, a Riverpod adapter, and ready-made settings UI.
version: 0.6.0
homepage: https://github.com/Zyzto/edadat
repository: https://github.com/Zyzto/edadat
issue_tracker: https://github.com/Zyzto/edadat/issues
license: MPL-2.0
screenshots:
  - description: Settings catalog in English
    path: screenshots/settings-en.png
  - description: Settings catalog in Arabic (RTL)
    path: screenshots/settings-ar.png
  - description: Bilingual search for theme
    path: screenshots/search-en.png
  - description: Dark theme settings catalog
    path: screenshots/settings-en-dark.png

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.3
  flutter_riverpod: ^3.0.1
  easy_localization: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
